<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hunnur.ai links</title>
<meta name="description" content="Free data engineering resources from hunnur.ai reels.">
<style>
:root{--ink:#0F1424;--blue:#2F5BFF;--white:#F4F6FB;--grey:#E6E9F2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(40% 35% at 20% 20%,rgba(47,91,255,.45),transparent 70%),radial-gradient(35% 30% at 85% 75%,rgba(47,91,255,.30),transparent 70%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.15)}}
main{position:relative;z-index:1;width:100%;max-width:480px;padding:48px 16px 40px}
h1{font-size:34px;line-height:1.1;margin:0 0 8px;text-align:center}
h1 em{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#7C98FF}
.tag{text-align:center;color:var(--grey);opacity:.8;margin:0 0 28px}
a.card{display:block;background:var(--white);color:var(--ink);text-decoration:none;border-radius:16px;padding:16px 18px;margin-bottom:12px;transition:transform .15s,box-shadow .15s;animation:in .5s both}
a.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(47,91,255,.4)}
a.card b{display:block;font-size:17px}
a.card span{font-size:14px;color:#4a5170}
a.card i{float:right;color:var(--blue);font-style:normal;font-weight:700}
a.ig{background:var(--blue);color:#fff}
a.ig span{color:#dfe6ff}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
</style>
</head>
<body>
<div class="bg"></div>
<main>
<h1>hunnur<em>.ai</em></h1>
<p class="tag" id="tag"></p>
<div id="list"></div>
</main>
<script>
fetch('links.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
  document.getElementById('tag').textContent=d.tagline;
  const list=document.getElementById('list');
  const items=[...d.links].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const mk=(l,cls,i)=>{
    const a=document.createElement('a');
    a.className='card'+(cls?' '+cls:'');a.href=l.url;a.target='_blank';a.rel='noopener';
    a.style.animationDelay=(i*60)+'ms';
    const i1=document.createElement('i');i1.textContent='→';
    const b=document.createElement('b');b.textContent=l.title;
    const s=document.createElement('span');s.textContent=l.note||'';
    a.append(i1,b,s);return a;
  };
  items.forEach((l,i)=>list.appendChild(mk(l,'',i)));
  list.appendChild(mk({title:'Instagram @hunnur.ai',note:'New reel every week',url:d.instagram},'ig',items.length));
});
</script>
</body>
</html>
